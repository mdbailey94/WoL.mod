name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  BEPINEX_URL: https://github.com/BepInEx/BepInEx/releases/download/v5.4.21/BepInEx_x64_5.4.21.0.zip
  UNITY_REF_URL: https://api.nuget.org/v3-flatcontainer/unity3d.unityengine/2018.1.6-f1/unity3d.unityengine.2018.1.6-f1.nupkg

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The game DLLs can't be committed, so build against a stand-in game folder:
      # the public BepInEx release plus a Unity reference UnityEngine.dll. The mod only
      # uses long-stable Unity APIs, so it loads on the game's own Unity version.
      - name: Assemble reference game folder
        run: |
          GAME_DIR="$RUNNER_TEMP/game"
          mkdir -p "$GAME_DIR/WizardOfLegend_Data/Managed"
          curl -sSL -o "$RUNNER_TEMP/bepinex.zip" "$BEPINEX_URL"
          unzip -q "$RUNNER_TEMP/bepinex.zip" -d "$GAME_DIR"
          curl -sSL -o "$RUNNER_TEMP/unity.nupkg" "$UNITY_REF_URL"
          unzip -q -j "$RUNNER_TEMP/unity.nupkg" lib/UnityEngine.dll -d "$GAME_DIR/WizardOfLegend_Data/Managed"
          echo "GAME_DIR=$GAME_DIR" >> "$GITHUB_ENV"

      - name: Build and package mods
        run: |
          mkdir -p dist
          for proj in */*.csproj; do
            name="$(basename "$proj" .csproj)"
            dotnet build "$proj" -c Release -p:GameDir="$GAME_DIR" -nologo
            stage="$RUNNER_TEMP/stage/$name"
            mkdir -p "$stage/BepInEx/plugins/$name"
            cp "$(dirname "$proj")/bin/Release/net35/$name.dll" "$stage/BepInEx/plugins/$name/"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/$name.zip" BepInEx)
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: mods
          path: dist/*.zip

      # Every push to main replaces the "latest" release with fresh downloads.
      - name: Publish latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Latest build" \
            --notes "Built from ${GITHUB_SHA::7}. Unzip into your Wizard of Legend folder (the one with WizardOfLegend.exe)."
